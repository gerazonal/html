<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST Unitas 시안 복제</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #000;
            margin: 0;
            padding: 0;
            color: #fff;
            overflow-x: hidden;
        }
        .text-stu-yellow {
            color: #FFD400;
        }
        .stu-yellow-bg {
            background-color: #FFD400;
        }
        
        /* 시안의 메인 텍스트 스타일 */
        .hero-title {
            font-size: 15vw;
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -0.05em;
            margin-bottom: 2rem;
        }
        
        /* 시안의 구분선 스타일 */
        .divider {
            width: 60px;
            height: 4px;
            background-color: #fff;
            margin: 2rem 0;
        }

        /* 입력란 스타일 (시안 톤앤매너 유지) */
        .input-field {
            background-color: transparent;
            border-bottom: 2px solid #fff;
            padding: 1rem 0;
            width: 100%;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-field:focus {
            border-color: #FFD400;
        }
        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        @media (min-width: 768px) {
            .hero-title {
                font-size: 120px;
            }
        }
    </style>
</head>
<body>

    <div class="min-h-screen flex flex-col p-8 md:p-16">
        <!-- 상단 로고 (시안 스타일) -->
        <header class="mb-20">
            <div class="text-3xl font-black italic tracking-tighter">
                ST <span class="text-stu-yellow">Unitas</span>
            </div>
        </header>

        <!-- 메인 시안 내용 -->
        <main class="flex-grow">
            <h1 class="hero-title">
                CREATE<br>
                <span class="text-stu-yellow">THE NEXT</span>
            </h1>
            
            <div class="divider"></div>

            <div class="text-lg md:text-xl font-bold mb-16 leading-relaxed opacity-90">
                에스티유니타스는 인류의 삶을 바꾸는<br>
                혁신적인 교육 서비스를 제공합니다.
            </div>

            <!-- 요청하신 3칸 입력란 (form 태그로 변경) -->
            <form id="applyForm" name="submit-to-google-sheet" class="max-w-md space-y-8 mb-20" onsubmit="return handleFormSubmit(event)">
                <div>
                    <input type="text" name="userName" placeholder="이름 (NAME)" required class="input-field font-bold">
                </div>
                <div>
                    <input type="tel" name="userPhone" placeholder="연락처 (PHONE)" required class="input-field font-bold">
                </div>
                <div>
                    <input type="email" name="userEmail" placeholder="이메일 (EMAIL)" required class="input-field font-bold">
                </div>
                
                <div class="pt-4">
                    <button type="submit" class="stu-yellow-bg text-black w-full py-5 text-xl font-black hover:opacity-90 transition-opacity">
                        SUBMIT NOW
                    </button>
                </div>
            </form>
        </main>

        <!-- 푸터 (현재 한국 시간 반영) -->
        <footer class="border-t border-white/10 pt-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 text-xs font-bold text-zinc-500 uppercase tracking-widest">
            <div>© ST Unitas. All rights reserved.</div>
            <div>Current Time: 2026. 01. 13 KOREA</div>
        </footer>
    </div>

    <script>
        function handleFormSubmit(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const data = Object.fromEntries(formData.entries());
            
            // 실제 서비스 시에는 여기서 API 통신을 진행합니다.
            console.log("Form Data Submitted:", data);
            alert("신청이 완료되었습니다.");
            return false;
        }
    </script>

    <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwJgbKEmCAFufoDG5kpRw-Ae17pi5aAfOyveOA9fC7x7ub1Z2hpowl_A-fbHVCAdBah/exec' // add your own app script link here
    const form = document.forms['submit-to-google-sheet']
    const msg = document.getElementById("msg")
  
    form.addEventListener('submit', e => {
      e.preventDefault()
      fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(response => {
            msg.innerHTML = "Message sent successfully"
            setTimeout(function(){
                msg.innerHTML = ""
            },5000)
            form.reset()
        })
        .catch(error => console.error('Error!', error.message))
    })
  </script>


</body>
</html>
