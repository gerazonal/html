<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onboarding</title>

  <link rel="stylesheet" href="./css/slide.css" />
</head>
<body>

  <div class="slider">
    <div class="skip">SKIP</div>

    <div class="slides" id="slides">
      <!-- Slide 1 -->
      <section class="slide">
        <h1 class="title">
위치 기반 매장 자동추천부터
즐겨찾는 매장 선택까지
        </h1>
        <div class="illustration">
          <img src="./images/slideillu1.png" alt="slide1" />
        </div>
      </section>

      <!-- Slide 2 -->
      <section class="slide">
        <h1 class="title">
내 취향에 맞는 메뉴 커스텀과
나만의 메뉴 저장
        </h1>
        <div class="illustration">
          <img src="./images/slideillu2.png" alt="slide2" />
        </div>
      </section>

      <!-- Slide 3 -->
      <section class="slide">
        <h1 class="title">
주문 시 스탬프 자동 적립되는
리워드 서비스
        </h1>
        <div class="illustration">
          <img src="./images/slideillu3.png" alt="slide3" />
        </div>
      </section>
    </div>

    <!-- Indicator -->
    <div class="indicator">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <!-- Button -->
    <button class="action-btn" id="actionBtn">다음</button>
  </div>

  <script src="./js/slide.js"></script>
</body>
</html>
