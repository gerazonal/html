<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TENPERCENT</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <main class="app">
    <section class="splash" aria-label="TENPERCENT 로딩 화면">

      <!-- LOGO AREA: 이미지 로고 (심볼 + 글씨 포함된 하나의 이미지) -->
      <div class="logo-slot" aria-hidden="true">
        <!-- 예시 -->
        <img src="./images/splash-logo.png" alt="TENPERCENT">
      </div>

      <!-- ... 반복 애니메이션 -->
      <div class="dots" role="status" aria-label="로딩 중">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

    </section>
  </main>

  <script src="./js/main.js"></script>
</body>
</html>
