<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>표준국어대사전 단어 검색</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 16px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px;
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .search-box input {
      flex: 1;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }
    .search-box button {
      padding: 0 18px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    .search-box button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .result-info {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .word {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .pos {
      display: inline-block;
      font-size: 13px;
      color: #1d4ed8;
      background: #e0e7ff;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .definition {
      font-size: 15px;
      line-height: 1.6;
    }
    .example {
      margin-top: 8px;
      font-size: 14px;
      color: var(--muted);
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 0;
    }
    footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <header>표준국어대사전 검색</header>
  <main class="container">
    <div class="search-box">
      <input type="text" id="keyword" placeholder="검색할 단어를 입력하세요" />
      <button id="searchBtn">검색</button>
    </div>

    <div id="resultInfo" class="result-info"></div>
    <div id="result"></div>
  </main>
  <footer>데이터 출처: 국립국어원 표준국어대사전 Open API</footer>

  <script>
    const API_URL = 'https://stdict.korean.go.kr/apisearch.do'; // 실제 호출은 프록시 필요
    const API_KEY = 'YOUR_API_KEY'; // 발급받은 인증키 입력

    const keywordInput = document.getElementById('keyword');
    const searchBtn = document.getElementById('searchBtn');
    const resultEl = document.getElementById('result');
    const resultInfoEl = document.getElementById('resultInfo');

    async function searchWord() {
      const keyword = keywordInput.value.trim();
      if (!keyword) return;

      resultEl.innerHTML = '';
      resultInfoEl.textContent = '검색 중...';
      searchBtn.disabled = true;

      try {
        // CORS 회피용 공개 프록시 예시 (운영에서는 서버 사용 권장)
        const proxy = 'https://api.allorigins.win/raw?url=';
        const url = `${proxy}${encodeURIComponent(`https://stdict.korean.go.kr/api/search.do?key=${API_KEY}&type_search=search&req_type=json&q=${keyword}`)}`;

        const res = await fetch(url);
        const data = await res.json();

        const items = data.channel?.item || [];
        resultInfoEl.textContent = `검색 결과 ${items.length}건`;

        if (!items.length) {
          resultEl.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
          return;
        }

        items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';

          card.innerHTML = `
            <div class="word">${item.word}</div>
            ${item.pos ? `<div class="pos">${item.pos}</div>` : ''}
            <div class="definition">${item.definition || ''}</div>
            ${item.example ? `<div class="example">예) ${item.example}</div>` : ''}
          `;

          resultEl.appendChild(card);
        });
      } catch (e) {
        console.error(e);
        resultInfoEl.textContent = '오류가 발생했습니다.';
      } finally {
        searchBtn.disabled = false;
      }
    }

    searchBtn.addEventListener('click', searchWord);
    keywordInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') searchWord();
    });
  </script>
</body>
</html>
