<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>부산맛집 정보 서비스</title>
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=25a096e373bc4a941e6e884a8064785b&libraries=services"></script>
  <link rel="stylesheet" href="/css/style.css">

</head>
<body>
  <div class="app">

    <!-- Topbar (List) -->
    <header id="topbarList" class="topbar" hidden>
      <div class="topbar-inner">
        <div class="title-wrap">
          <div class="title">부산맛집</div>
          <div class="subtitle" id="listSubtitle">부산광역시_부산맛집 정보</div>
        </div>
        <button class="icon-btn" id="btnRefresh" title="새로고침" aria-label="새로고침">
          <span class="i" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
              <path d="M21 3v6h-6"/>
            </svg>
          </span>
        </button>
        <button class="icon-btn" id="btnFavorites" title="즐겨찾기" aria-label="즐겨찾기">
          <span class="i" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </span>
        </button>
      </div>
      <div class="search-row">
        <div class="search">
          <span class="i" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <path d="M21 21l-4.3-4.3"/>
            </svg>
          </span>
          <input id="q" type="search" placeholder="가게명/주소/메뉴로 검색" autocomplete="off" />
        </div>
      </div>
    </header>

    <!-- Topbar (Detail) -->
    <header id="topbarDetail" class="topbar" hidden>
      <div class="topbar-inner">
        <button class="icon-btn" id="btnBack" aria-label="뒤로가기" title="뒤로가기">
          <span class="i" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </span>
        </button>
        <div class="title-wrap">
          <div class="title" id="detailTitle">상호명</div>
          <div class="subtitle" id="detailAddr">주소</div>
        </div>
        <button class="icon-btn" id="btnSearch" title="검색" aria-label="검색">
          <span class="i" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <path d="M21 21l-4.3-4.3"/>
            </svg>
          </span>
        </button>
      </div>
    </header>

    <main class="content">
      <!-- LIST VIEW -->
      <section id="viewList" hidden>
        <div id="listState" class="state">불러오는 중…</div>
        <div id="list" class="list" aria-label="맛집 목록"></div>
      </section>

      <!-- DETAIL VIEW -->
      <section id="viewDetail" hidden>
        <div class="hero">
          <div class="fav-floating">
            <button class="icon-btn" id="btnFavDetail" aria-label="즐겨찾기 토글" title="즐겨찾기">
              <span class="i" aria-hidden="true" id="favIconDetail"></span>
            </button>
          </div>
          <div class="hero-img" id="heroImg">대표 이미지</div>
        </div>

        <div class="detail-section">
          <div>
            <span class="label">상호명</span>
            <div class="value" id="vName">-</div>
          </div>

          <div>
            <span class="label">주소</span>
            <div class="value" id="vAddr">-</div>
          </div>

          <div>
            <span class="label">소개</span>
            <div class="value muted" id="vIntro">-</div>
          </div>

          <div>
            <span class="label">대표메뉴</span>
            <div class="value" id="vMenu">-</div>
          </div>

          <div>
            <span class="label">문의</span>
            <div class="value" id="vTel">-</div>
          </div>

          <div>
            <span class="label">운영시간</span>
            <div class="value" id="vTime">-</div>
          </div>
        </div>

        <div class="cta">
          <button class="btn" id="btnKakaoRoute">길찾기(카카오맵)</button>
          <div style="height: 10px"></div>
          <button class="btn secondary" id="btnHome">목록으로</button>
        </div>

        <div class="map">
          <div id="map" aria-label="카카오 지도"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="하단 탭" hidden>
      <button class="tab active" id="tabList">맛집</button>
      <button class="tab" id="tabFav">즐겨찾기</button>
    </nav>
  </div>
  <script src="./js/main.js"></script>
</body>
</html>
