<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>부산맛집 정보 서비스</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./css/style.css" />

  <!-- Kakao Maps SDK -->
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=25a096e373bc4a941e6e884a8064785b&libraries=services"></script>
</head>
<body>
  <div class="app">

    <!-- Topbar (List) -->
    <header id="topbarList" class="topbar" hidden>
      <div class="topbar-inner">
        <div class="title-wrap">
          <div class="title">부산맛집</div>
          <div class="subtitle" id="listSubtitle">부산광역시_부산맛집 정보</div>
        </div>
        <button class="icon-btn" id="btnRefresh" title="새로고침">↻</button>
        <button class="icon-btn" id="btnFavorites" title="즐겨찾기">♥</button>
      </div>

      <div class="search-row">
        <div class="search">
          <input id="q" type="search" placeholder="가게명/주소/메뉴로 검색" />
        </div>
      </div>
    </header>

    <!-- Topbar (Detail) -->
    <header id="topbarDetail" class="topbar" hidden>
      <div class="topbar-inner">
        <button class="icon-btn" id="btnBack">←</button>
        <div class="title-wrap">
          <div class="title" id="detailTitle"></div>
          <div class="subtitle" id="detailAddr"></div>
        </div>
        <button class="icon-btn" id="btnSearch">🔍</button>
      </div>
    </header>

    <main class="content">
      <section id="viewList" hidden>
        <div id="listState" class="state">불러오는 중…</div>
        <div id="list" class="list"></div>
      </section>

      <section id="viewDetail" hidden>
        <div class="hero">
          <div class="hero-img" id="heroImg">대표 이미지</div>
        </div>

        <div class="detail-section">
          <div><span class="label">상호명</span><div id="vName"></div></div>
          <div><span class="label">주소</span><div id="vAddr"></div></div>
          <div><span class="label">소개</span><div id="vIntro"></div></div>
          <div><span class="label">대표메뉴</span><div id="vMenu"></div></div>
          <div><span class="label">문의</span><div id="vTel"></div></div>
          <div><span class="label">운영시간</span><div id="vTime"></div></div>
        </div>

        <div class="cta">
          <button id="btnKakaoRoute" class="btn">길찾기</button>
          <button id="btnHome" class="btn secondary">목록으로</button>
        </div>

        <div class="map">
          <div id="map"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- App JS -->
  <script src="./js/main.js"></script>
</body>
</html>
